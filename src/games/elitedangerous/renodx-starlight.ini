# RenoDX starlight colour table for Elite Dangerous
# Copy next to EliteDangerous64.exe (elite-dangerous-odyssey-64 folder).
#
# Used by the "Class Table" mode. Which star lights you is found from the
# renderer itself (the light direction is matched against the star draws);
# its class comes from renodx-starlight-signatures.ini, which RenoDX fills
# in as you arrive in systems (or via "Label light 1's star" in the overlay).
#
# Format:  StarClass = R G B   (linear Rec.709, any scale; only the hue and
# chroma are used, brightness always stays what the game computed)
#
# Keys are the journal's StarClass strings. Unlisted classes fall back by
# prefix ("K_OrangeGiant" -> "K", "DAB" -> "D"), then to the star's own
# rendered colour.
#
# PLACEHOLDER VALUES: rough Horizons-style hues, meant to be replaced with
# spectrum-derived colours.

O    = 0.62 0.74 1.00
B    = 0.70 0.80 1.00
A    = 0.86 0.90 1.00
F    = 1.00 0.98 0.93
G    = 1.00 0.93 0.82
K    = 1.00 0.76 0.52
M    = 1.00 0.56 0.30
MS   = 1.00 0.50 0.26
S    = 1.00 0.48 0.24
L    = 1.00 0.38 0.18
T    = 0.85 0.30 0.55
Y    = 0.55 0.25 0.45
TTS  = 1.00 0.66 0.42
AeBe = 0.80 0.86 1.00
W    = 0.60 0.72 1.00
C    = 1.00 0.38 0.14
D    = 0.76 0.84 1.00
N    = 0.70 0.80 1.00

# Star Colour mode: how a class's colour is chosen. Default for every class
# is "constant" (the star's own designer colour), which looks right for the
# ordinary classes. Override only the classes that look odd with it:
#   constant   the star's designer colour (default)
#   measured   the colour of the rendered disc
#   table      this class's colour from the table above
#   vanilla    keep the game's own light colour for this class
# "<class>.saturation = x" multiplies that class's chroma (on top of the
# Saturation slider); 1 = unchanged. Keys fall back by prefix like the
# colours. Press "Reload tables" after editing.
#
# Brown dwarfs: the game's own light already has the right hue, it is only
# bland, so keep it and boost it.

Y.source = vanilla
Y.saturation = 2.6
T.source = vanilla
T.saturation = 2.6
L.source = vanilla
L.saturation = 2.4
# T Tauri stars (class TTS) are not brown dwarfs: stop the prefix fallback to T.
TTS.source = constant
TTS.saturation = 1.0
